# Scene for seq_materials.txt (picked up by the test scripts through the
# "<sequence file>.cfg" naming convention).
#
# materialtest.gltf is a row of subdivided boxes covering the mesh and material states the
# sample branches on. Regenerate it with `python tests/make_materialtest.py`.
#
# The bunny is POSITION + NORMAL and one opaque material, so on it the whole attribute and
# material half of the shader permutation space - ALLOW_VERTEX_TANGENTS,
# ALLOW_VERTEX_TEXCOORD_0 / _1, HAS_TEXTURED_MATERIALS, HAS_ALPHA_TEST, USE_TWO_SIDED -
# never compiles at all.

--scene "materialtest.gltf"

# normal 1 | tangent 2 | texcoord 0 4 | texcoord 1 8
--attributes 15
--multimaterials 1

# the fixture processes in about a millisecond, so caching it buys nothing and only risks
# a run picking up a cache from an older make_materialtest.py
--autoloadcache 0
--autosavecache 0

# both are load time filters, so they have to be off here rather than in a sequence
--skipalphablended 0
--skipalphamasked 0

# 4x4 grid, so there is instancing to share and cull against
--gridcopies 16
--gridconfig 13
--gridunique 0

--streaming 1
--autosharing 0

--supersample 1
--vsync 0
--loderror 1
--adaptiveerror 0
--pathtraceautoexposure 1
--sundirection 0.4 0.7 0.5
