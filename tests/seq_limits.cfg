# Scene for seq_limits.txt (picked up by the test scripts through the "<sequence file>.cfg"
# naming convention).
#
# A grid that cannot possibly fit into the budgets the sequences impose: 1024 copies, each
# with its own geometry, and a tight lod error so the traversal keeps asking for detail that
# there is no room for. Running out is the normal state here, not the exception.
#
# Note the grid copy count doubles as the geometry count, which is the floor for
# --maxresidentgroups - starving the streamer harder than that is the geometry and transfer
# budgets' job.
#
# The sample reports these as warnings in the viewport ("Render clusters limit exceeded",
# "Traversal task limit exceeded", "No resident groups left", "Few CLAS groups left",
# "Little geometry memory left") and is expected to keep rendering something - the point of
# the sequences is that hitting a limit degrades the image, it does not take the app or the
# device down.

--scene "../_downloaded_resources/bunny_v2/bunny.gltf"

--gridcopies 1024
--gridconfig 13
# unique geometries, so the streamed working set actually scales with the grid
--gridunique 1

--streaming 1
--autosharing 0

--supersample 1
--vsync 0
# a tight error keeps the demand well above whatever the budgets allow
--loderror 0.25
--adaptiveerror 0
--pathtraceautoexposure 1
--sundirection 0.4 0.7 0.5
