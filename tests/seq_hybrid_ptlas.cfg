# Scene for seq_hybrid_ptlas.txt (picked up by the test scripts through the "<sequence file>.cfg"
# naming convention).
#
# The partition grid resolution is derived as ceil(sqrt(instances / --partitionderivedtarget)), so
# bunny_grid.cfg's 256 instances give a 2x2 grid - four partitions, which is too few for the
# early-out's block compaction to have anything to compact. 4096 instances at the default
# target of 64 give an 8x8 grid instead.
#
# Geometry stays shared (no --gridunique): BLAS sharing and caching have to converge before
# a partition can sit entirely on a persistent BLAS, which is what the early-out skips.

--scene "../_downloaded_resources/bunny_v2/bunny.gltf"

--gridcopies 4096
--gridconfig 13

--streaming 1
--autosharing 0

--supersample 1
--vsync 0
--loderror 1
--adaptiveerror 0
--pathtraceautoexposure 1
--sundirection 0.4 0.7 0.5
