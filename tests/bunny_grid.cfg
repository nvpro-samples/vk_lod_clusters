# Test scene: a grid of bunnies, sized so that a single fit-to-scene camera view spans
# many lod levels (near copies at lod 0, far copies at the coarsest levels). That range is
# what makes culling, discrete lod, BLAS sharing/merging/caching actually kick in.
#
# Everything that would otherwise be picked by a heuristic is pinned here, so a run is
# comparable between machines and between sequences.
#
# Used by the sequence files in this directory, see README.md.

# must be explicit: without --scene the sample forces "unique geometries" onto the
# built-in bunny, which would make --gridunique 0 a no-op
--scene "../_downloaded_resources/bunny_v2/bunny.gltf"

# 16x16 grid in the xz plane with rotations, 256 instances of the one bunny geometry.
# --gridunique is deliberately not set here, the sequences toggle it.
--gridcopies 256
--gridconfig 13

# streaming is required for BLAS merging and caching
--streaming 1

# the heuristic would override --blassharing per scene, which breaks the sharing matrix
--autosharing 0

# deterministic framing / shading
--supersample 1
--vsync 0
--loderror 1
--adaptiveerror 0
--pathtraceautoexposure 1
--sundirection 0.4 0.7 0.5
