# Scene for seq_16bit_dispatch.txt (picked up by the test scripts through the
# "<sequence file>.cfg" naming convention).
#
# Same bunny grid as bunny_grid.cfg, but with two differences that matter for the
# 16 bit compute launch path:
#
#  * --force16bitdispatch makes the sample take that path on hardware that does not need
#    it. It is a startup option (the streaming pipelines are built once, from the scene,
#    not per renderer), which is why this is a separate scene config rather than a
#    parameter inside the sequences.
#
#  * 16384 instances and a tight lod error, so the linear work group counts actually exceed
#    the 16 bit limit. Below 65536 fit16bitLaunchGrid() keeps the launch 1D, and then the
#    grid conversion, the padded trailing work groups and the linearized work group index
#    are never exercised at all.

--scene "../_downloaded_resources/bunny_v2/bunny.gltf"

--force16bitdispatch 1

# 128x128 grid, all sharing the one bunny geometry so the instance count can be this high
# without the streaming budget becoming the limit
--gridcopies 16384
--gridconfig 13
--gridunique 0

--streaming 1
--autosharing 0

--supersample 1
--vsync 0
# a tight error is what pushes the rendered cluster and traversal task counts past 65536
--loderror 0.1
--adaptiveerror 0
--pathtraceautoexposure 1
--sundirection 0.4 0.7 0.5
