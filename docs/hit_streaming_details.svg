<text x="40" y="505" fill="#f39c12" font-size="20" xml:space="preserve">U32 SceneBuilding.</text>
<text x="40" y="532" fill="#f39c12" font-size="18" xml:space="preserve">instanceHitScale[]</text>
<text x="40" y="559" fill="#f39c12" font-size="18" xml:space="preserve">• level, errorScale = 2^-level</text>
<text x="40" y="586" fill="#f39c12" font-size="18" xml:space="preserve">• held frames before coarsening</text>
<text x="40" y="613" fill="#f39c12" font-size="18" xml:space="preserve">• read by classify + traversal</text>
<text x="40" y="690" fill="#f39c12" font-size="17" xml:space="preserve">U32 geometryHitDemandLevel[]</text>
<text x="40" y="714" fill="#f39c12" font-size="16" xml:space="preserve">• per geometry, raises lodLevelMin</text>
<rect x="400" y="140" width="55" height="42" fill="#c9d9f5" stroke="#4472c4" stroke-width="1.5"/>
<rect x="455" y="140" width="55" height="42" fill="#c9d9f5" stroke="#4472c4" stroke-width="1.5"/>
<rect x="510" y="140" width="55" height="42" fill="#c9d9f5" stroke="#4472c4" stroke-width="1.5"/>
<rect x="565" y="140" width="55" height="42" fill="#c9d9f5" stroke="#4472c4" stroke-width="1.5"/>
