<text x="592.5" y="228" fill="#4472c4" font-size="14" font-style="italic" text-anchor="middle">fine → coarse</text>
<text x="400" y="250" fill="#1f5fa8" font-size="20" xml:space="preserve">U32 Resident.groupHitFrames[]</text>
<text x="400" y="277" fill="#1f5fa8" font-size="18" xml:space="preserve">• frame index (15 bit)</text>
<text x="400" y="304" fill="#1f5fa8" font-size="18" xml:space="preserve">• cone width (inv. log2, 16 bit)</text>
<text x="400" y="331" fill="#1f5fa8" font-size="18" xml:space="preserve">• no finer group resident (bit 31)</text>
<text x="400" y="358" fill="#1f5fa8" font-size="18" xml:space="preserve">• coarser groups inherit the</text>
<text x="400" y="385" fill="#1f5fa8" font-size="18" xml:space="preserve">  newest hit of resident finer ones</text>
<rect x="400" y="445" width="55" height="42" fill="#c9d9f5" stroke="#4472c4" stroke-width="1.5"/>
<rect x="455" y="445" width="55" height="42" fill="#c9d9f5" stroke="#4472c4" stroke-width="1.5"/>
<rect x="510" y="445" width="55" height="42" fill="#c9d9f5" stroke="#4472c4" stroke-width="1.5"/>
<rect x="565" y="445" width="55" height="42" fill="#c9d9f5" stroke="#4472c4" stroke-width="1.5"/>
<rect x="620" y="445" width="55" height="42" fill="#c9d9f5" stroke="#4472c4" stroke-width="1.5"/>
<use href="#hit" x="537.5" y="466.0"/>
<text x="400" y="530" fill="#1f5fa8" font-size="20" xml:space="preserve">U32 Resident.groupHitWidths[]</text>
<text x="400" y="557" fill="#1f5fa8" font-size="18" xml:space="preserve">• smoothed demand width</text>
<text x="400" y="584" fill="#1f5fa8" font-size="18" xml:space="preserve">• hits pull it finer at once,</text>
<text x="400" y="611" fill="#1f5fa8" font-size="18" xml:space="preserve">  relaxes coarser per frame</text>
<rect x="400" y="660" width="300" height="92" rx="6" fill="none" stroke="#4472c4" stroke-dasharray="5 4"/>
<text x="414" y="686" fill="#1f5fa8" font-size="17" font-weight="600" xml:space="preserve">Age filter hit-unload:</text>
<text x="414" y="711" fill="#1f5fa8" font-size="16" xml:space="preserve">stale and no finer group resident,</text>
<text x="414" y="736" fill="#1f5fa8" font-size="16" xml:space="preserve">so groups leave fine → coarse</text>
