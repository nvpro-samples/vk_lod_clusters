<text x="40" y="225" fill="#f39c12" font-size="20" xml:space="preserve">U32 SceneBuilding.</text>
<text x="40" y="252" fill="#f39c12" font-size="18" xml:space="preserve">instanceHitDemand[]</text>
<text x="40" y="279" fill="#f39c12" font-size="18" xml:space="preserve">• raw errorScale as float bits,</text>
<text x="40" y="306" fill="#f39c12" font-size="18" xml:space="preserve">  atomicMin over the frame's hits</text>
<text x="40" y="333" fill="#f39c12" font-size="18" xml:space="preserve">• &lt; 1.0 lowers error for higher</text>
<text x="40" y="360" fill="#f39c12" font-size="18" xml:space="preserve">  detail (magnification)</text>
<path d="M330,161.0 C360,161.0 360,441.0 314,441.0" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aOrange)"/>
<text x="352" y="320.0" fill="#f39c12" font-size="15" font-style="italic" transform="rotate(90 352 320.0)" text-anchor="middle">filter</text>
<rect x="40" y="420" width="54" height="42" fill="#fbe3c8" stroke="#f39c12" stroke-width="1.5"/>
<rect x="94" y="420" width="54" height="42" fill="#fbe3c8" stroke="#f39c12" stroke-width="1.5"/>
