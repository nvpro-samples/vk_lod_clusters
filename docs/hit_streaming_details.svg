<text x="780" y="225" fill="#8a2be2" font-size="20" xml:space="preserve">U32 Geometry.groupDemand[]</text>
<text x="780" y="252" fill="#8a2be2" font-size="18" xml:space="preserve">• frame index</text>
<text x="780" y="279" fill="#8a2be2" font-size="18" xml:space="preserve">• demand width</text>
<text x="780" y="306" fill="#8a2be2" font-size="18" xml:space="preserve">• flooded coarse → fine via the overlaps,</text>
<text x="780" y="333" fill="#8a2be2" font-size="18" xml:space="preserve">  one lod step per pass (demand_tree</text>
<text x="780" y="360" fill="#8a2be2" font-size="18" xml:space="preserve">  BFS or demand_levels sweep)</text>
