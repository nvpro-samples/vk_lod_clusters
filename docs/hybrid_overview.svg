 <text x="640.0" y="208.0" font-size="19" fill="#6aa84f" text-anchor="start" font-weight="normal">the parts nothing sees</text>
 <text x="645.0" y="440.0" font-size="19" fill="#7f7f7f" text-anchor="start" font-weight="normal">Occluded or off-screen</text>
