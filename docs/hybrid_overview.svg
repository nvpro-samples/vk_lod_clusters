 <text x="1610.0" y="160.0" font-size="19" fill="#6aa84f" text-anchor="start" font-weight="normal">Visible: the raster cut,</text>
 <text x="1610.0" y="184.0" font-size="19" fill="#6aa84f" text-anchor="start" font-weight="normal">the BLAS matches it</text>
 <text x="1615.0" y="275.0" font-size="19" fill="#b45f06" text-anchor="start" font-weight="normal">New: occluded parts of</text>
 <text x="1615.0" y="299.0" font-size="19" fill="#b45f06" text-anchor="start" font-weight="normal">visible instances get</text>
 <text x="1615.0" y="323.0" font-size="19" fill="#b45f06" text-anchor="start" font-weight="normal">coarser detail, in the</text>
 <text x="1615.0" y="347.0" font-size="19" fill="#b45f06" text-anchor="start" font-weight="normal">raster and the BLAS</text>
 <text x="1615.0" y="440.0" font-size="19" fill="#7f7f7f" text-anchor="start" font-weight="normal">Occluded or off-screen</text>
 <text x="1615.0" y="464.0" font-size="19" fill="#7f7f7f" text-anchor="start" font-weight="normal">instances: as in the path</text>
 <text x="1615.0" y="488.0" font-size="19" fill="#7f7f7f" text-anchor="start" font-weight="normal">tracer, no raster to match</text>
 <text x="1460.0" y="60.0" font-size="19" fill="#e0a800" text-anchor="start" font-weight="normal">Secondary rays start on</text>
 <text x="1460.0" y="84.0" font-size="19" fill="#e0a800" text-anchor="start" font-weight="normal">the rasterized hit</text>
 <text x="1030.0" y="630.0" font-size="21" fill="#000000" text-anchor="start" font-weight="normal">Raster gives primary visibility, path tracing continues from it.</text>
</svg>
